<!-- size-full, not absolute: MapLibre's unlayered CSS forces position: relative on this element. -->
<div #map class="size-full bg-sky-100"></div>

@if (mapFailed()) {
  <div class="absolute inset-0 flex items-center justify-center bg-slate-100 p-6">
    <p class="max-w-sm text-center text-slate-600">
      Your browser can't show the map. Try a recent version of Chrome, Safari or Firefox.
    </p>
  </div>
}

@if (hasPosition() && !following()) {
  <button
    type="button"
    (click)="recenter()"
    aria-label="Center the map on my location"
    class="absolute right-4 bottom-[max(2.5rem,calc(env(safe-area-inset-bottom)+1.5rem))] flex size-12 items-center justify-center rounded-full bg-white/90 text-sky-600 shadow-lg ring-1 ring-black/5 backdrop-blur-md transition hover:bg-white active:scale-95"
  >
    <svg viewBox="0 0 24 24" class="size-6" fill="currentColor" aria-hidden="true">
      <path d="M21 3 3 10.5l7.5 3L13.5 21z" />
    </svg>
  </button>
}
