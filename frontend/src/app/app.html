<main class="relative h-dvh w-full overflow-hidden bg-slate-100 text-slate-900 antialiased">
  <app-tour-map />

  <header
    class="pointer-events-none absolute inset-x-0 top-0 flex justify-center px-4 pt-[max(1rem,env(safe-area-inset-top))]"
  >
    <div
      class="pointer-events-auto flex items-center gap-2 rounded-full bg-white/85 px-4 py-2 shadow-lg ring-1 ring-black/5 backdrop-blur-md"
    >
      <svg viewBox="0 0 24 24" class="size-5 text-sky-600" fill="currentColor" aria-hidden="true">
        <path
          d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"
        />
      </svg>
      <h1 class="text-base font-semibold tracking-tight">Tour Guide</h1>
    </div>
  </header>

  <div
    class="pointer-events-none absolute inset-x-0 bottom-0 flex justify-center px-4 pb-[max(2.5rem,calc(env(safe-area-inset-bottom)+1.5rem))]"
  >
    @if (location.status() === 'locating') {
      <p
        role="status"
        class="flex items-center gap-2 rounded-full bg-white/85 px-4 py-2 text-sm font-medium text-slate-700 shadow-lg ring-1 ring-black/5 backdrop-blur-md"
      >
        <span
          class="size-4 animate-spin rounded-full border-2 border-sky-500 border-t-transparent"
          aria-hidden="true"
        ></span>
        Finding your location…
      </p>
    } @else if (problem(); as problem) {
      <section
        role="alert"
        class="pointer-events-auto w-full max-w-sm rounded-3xl bg-white/90 p-5 shadow-xl ring-1 ring-black/5 backdrop-blur-md"
      >
        <h2 class="text-lg font-semibold">{{ problem.title }}</h2>
        <p class="mt-1 text-sm leading-relaxed text-slate-600">{{ problem.text }}</p>
        @if (problem.canRetry) {
          <button
            type="button"
            (click)="location.start()"
            class="mt-4 w-full rounded-full bg-sky-600 px-4 py-2.5 text-sm font-semibold text-white shadow transition hover:bg-sky-700 active:scale-[0.98]"
          >
            Try again
          </button>
        }
      </section>
    }
  </div>
</main>
